<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif">
  <!--FONTS dm-400 dm-600 manrope-600 mono-400-->
  <!-- Colour roles, Forma light here; src/pages/images/[mockup].svg.ts swaps in the preset's values. -->
  <style id="palette">svg{--m-surface:#FFFFFF;--m-surface-2:#F9F7FC;--m-line:#ECE8F2;--m-ink:#1B1426;--m-ink-2:#687083;--m-ink-3:#9BA4B6;--m-tint:#EFEBFF;--m-tint-2:#E4DDFB;--m-tint-3:#D9CFFB;--m-accent:#5B3FE0;--m-accent-text:#5B3FE0;--m-accent-2:#8B5CF6;--m-accent-light:#7B5CF2;--m-highlight:#C084FC;--m-grad-start:#6246EA;--m-terminal-accent:#A78BFA;--m-btn-1:#6A4EEE;--m-btn-2:#5236D6;--m-frame-1:#35278A;--m-frame-2:#5139C9;--m-frame-3:#7658EC;--m-glow:#CDB4FF;--m-page-glow:#C9B6FF;--m-reverse:#1B1426;--m-shadow:#1B1426;--m-shadow-tint:#2A1D5C}</style>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--m-frame-1)"/>
      <stop offset="0.52" style="stop-color:var(--m-frame-2)"/>
      <stop offset="1" style="stop-color:var(--m-frame-3)"/>
    </linearGradient>
    <radialGradient id="glowTR" cx="1600" cy="0" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-opacity="0.6" style="stop-color:var(--m-glow)"/>
      <stop offset="1" stop-opacity="0" style="stop-color:var(--m-glow)"/>
    </radialGradient>
    <radialGradient id="glowBL" cx="0" cy="900" r="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-opacity="0.32" style="stop-color:var(--m-highlight)"/>
      <stop offset="1" stop-opacity="0" style="stop-color:var(--m-highlight)"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#FFFFFF" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--m-grad-start)"/>
      <stop offset="0.5" style="stop-color:var(--m-accent-2)"/>
      <stop offset="1" style="stop-color:var(--m-highlight)"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--m-btn-1)"/>
      <stop offset="1" style="stop-color:var(--m-btn-2)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-opacity="0.35" style="flood-color:var(--m-shadow)"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity="0.28" style="flood-color:var(--m-shadow)"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#frame)"/>
  <rect width="1600" height="900" fill="url(#glowTR)"/>
  <rect width="1600" height="900" fill="url(#glowBL)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- The product: Paylark's invoice list and the next reminder (a made-up product; addresses on example.com) -->
  <g transform="translate(120 88)">
    <rect width="1360" height="860" rx="22" filter="url(#shadow)" style="fill:var(--m-surface)"/>
    <path d="M22 0h1316a22 22 0 0 1 22 22v30H0V22A22 22 0 0 1 22 0z" style="fill:var(--m-surface-2)"/>
    <line x1="0" y1="52" x2="1360" y2="52" style="stroke:var(--m-line)"/>
    <circle cx="28" cy="26" r="6" style="fill:var(--m-tint-2)"/>
    <circle cx="48" cy="26" r="6" style="fill:var(--m-tint-2)"/>
    <circle cx="68" cy="26" r="6" style="fill:var(--m-tint-2)"/>
    <rect x="560" y="14" width="240" height="25" rx="12.5" style="fill:var(--m-surface);stroke:var(--m-line)"/>
    <path d="M627 24.5v-2a3 3 0 0 1 6 0v2 M625.5 24.5h9v7h-9z" fill="none" stroke-width="1.4" stroke-linejoin="round" style="stroke:var(--m-ink-3)"/>
    <text x="642" y="31" font-size="13" style="fill:var(--m-ink-2)">app.example.com</text>

    <!-- Sidebar -->
    <rect x="0" y="52" width="232" height="808" style="fill:var(--m-surface-2)"/>
    <line x1="232" y1="52" x2="232" y2="860" style="stroke:var(--m-line)"/>
    <rect x="28" y="80" width="26" height="26" rx="8" fill="url(#btn)"/>
    <path d="M35.5 93.5l5 5 9-10" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="99" font-family="Manrope, sans-serif" font-size="17" font-weight="600" style="fill:var(--m-ink)">Paylark</text>
    <g font-size="14">
      <rect x="16" y="134" width="200" height="38" rx="10" style="fill:var(--m-tint)"/>
      <rect x="32" y="146" width="14" height="14" rx="3" fill="none" stroke-width="1.8" style="stroke:var(--m-accent-text)"/>
      <text x="58" y="158" font-weight="600" style="fill:var(--m-accent-text)">Invoices</text>
      <circle cx="39" cy="197" r="7" fill="none" stroke-width="1.8" style="stroke:var(--m-ink-3)"/>
      <text x="58" y="202" style="fill:var(--m-ink-2)">Reminders</text>
      <circle cx="39" cy="238" r="4" fill="none" stroke-width="1.8" style="stroke:var(--m-ink-3)"/>
      <path d="M31 251a8 6 0 0 1 16 0" fill="none" stroke-width="1.8" style="stroke:var(--m-ink-3)"/>
      <text x="58" y="246" style="fill:var(--m-ink-2)">Clients</text>
      <circle cx="39" cy="285" r="6" fill="none" stroke-width="1.8" stroke-dasharray="3 2" style="stroke:var(--m-ink-3)"/>
      <text x="58" y="290" style="fill:var(--m-ink-2)">Settings</text>
    </g>
    <rect x="16" y="520" width="200" height="104" rx="14" style="fill:var(--m-surface);stroke:var(--m-line)"/>
    <text x="34" y="550" font-size="12" style="fill:var(--m-ink-2)">Next reminder</text>
    <text x="34" y="578" font-family="Manrope, sans-serif" font-size="19" font-weight="600" style="fill:var(--m-ink)">Nov 2, 9:00</text>
    <text x="34" y="602" font-size="12" style="fill:var(--m-ink-3)">Maple Design · #1042</text>

    <!-- Header -->
    <text x="272" y="118" font-family="Manrope, sans-serif" font-size="28" font-weight="600" style="fill:var(--m-ink)">Invoices</text>
    <text x="272" y="146" font-size="15" style="fill:var(--m-ink-2)">3 open · 1 overdue</text>
    <rect x="1046" y="90" width="122" height="40" rx="10" style="fill:var(--m-surface);stroke:var(--m-line)"/>
    <text x="1107" y="115" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--m-ink)">Import CSV</text>
    <rect x="1180" y="90" width="140" height="40" rx="10" fill="url(#btn)"/>
    <rect x="1181" y="91" width="138" height="1.5" rx="0.75" fill="#FFFFFF" fill-opacity="0.35"/>
    <text x="1250" y="115" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Add invoice</text>

    <!-- Totals -->
    <g transform="translate(272 176)">
      <rect width="336" height="96" rx="14" style="fill:var(--m-surface);stroke:var(--m-line)"/>
      <text x="20" y="34" font-size="13" style="fill:var(--m-ink-2)">Outstanding</text>
      <text x="20" y="74" font-family="Manrope, sans-serif" font-size="28" font-weight="600" style="fill:var(--m-ink)">$5,330</text>
    </g>
    <g transform="translate(628 176)">
      <rect width="336" height="96" rx="14" style="fill:var(--m-surface);stroke:var(--m-line)"/>
      <text x="20" y="34" font-size="13" style="fill:var(--m-ink-2)">Overdue</text>
      <text x="20" y="74" font-family="Manrope, sans-serif" font-size="28" font-weight="600" style="fill:var(--m-ink)">$1,200</text>
      <rect x="226" y="18" width="90" height="24" rx="12" fill="#E5484D" fill-opacity="0.12"/>
      <text x="271" y="35" font-size="12" font-weight="600" fill="#D13D43" text-anchor="middle">1 invoice</text>
    </g>
    <g transform="translate(984 176)">
      <rect width="336" height="96" rx="14" style="fill:var(--m-surface);stroke:var(--m-line)"/>
      <text x="20" y="34" font-size="13" style="fill:var(--m-ink-2)">Paid, last 30 days</text>
      <text x="20" y="74" font-family="Manrope, sans-serif" font-size="28" font-weight="600" style="fill:var(--m-ink)">$3,250</text>
    </g>

    <!-- Invoice list -->
    <g transform="translate(272 296)">
      <rect width="668" height="352" rx="16" style="fill:var(--m-surface);stroke:var(--m-line)"/>
      <path d="M16 0h636a16 16 0 0 1 16 16v32H0V16A16 16 0 0 1 16 0z" style="fill:var(--m-surface-2)"/>
      <line x1="0" y1="48" x2="668" y2="48" style="stroke:var(--m-line)"/>
      <g font-size="11" font-weight="600" letter-spacing="1.1" style="fill:var(--m-ink-3)">
        <text x="24" y="30">CLIENT</text><text x="236" y="30">AMOUNT</text><text x="346" y="30">REMINDERS</text><text x="498" y="30">STATUS</text>
      </g>

      <g transform="translate(0 48)">
        <circle cx="44" cy="38" r="16" style="fill:var(--m-tint-2)"/>
        <text x="44" y="42.5" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--m-accent-text)">MD</text>
        <text x="72" y="34" font-size="15" font-weight="600" style="fill:var(--m-ink)">Maple Design</text>
        <text x="72" y="54" font-size="12" style="fill:var(--m-ink-3)">#1042 · due Oct 28</text>
        <text x="236" y="43" font-size="15" font-weight="600" style="fill:var(--m-ink)">$1,200</text>
        <circle cx="352" cy="38" r="5" style="fill:var(--m-accent)"/><circle cx="368" cy="38" r="5" style="fill:var(--m-accent)"/><circle cx="384" cy="38" r="5" style="fill:var(--m-tint-3)"/><circle cx="400" cy="38" r="5" style="fill:var(--m-tint-3)"/>
        <text x="416" y="42.5" font-size="12" style="fill:var(--m-ink-2)">2 of 4</text>
        <rect x="498" y="24" width="138" height="28" rx="14" fill="#E5484D" fill-opacity="0.12"/>
        <text x="567" y="42.5" font-size="12" font-weight="600" fill="#D13D43" text-anchor="middle">Overdue · 4 days</text>
      </g>
      <line x1="0" y1="124" x2="668" y2="124" style="stroke:var(--m-line)"/>
      <g transform="translate(0 124)">
        <circle cx="44" cy="38" r="16" style="fill:var(--m-tint-2)"/>
        <text x="44" y="42.5" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--m-accent-text)">OL</text>
        <text x="72" y="34" font-size="15" font-weight="600" style="fill:var(--m-ink)">Orbit Labs</text>
        <text x="72" y="54" font-size="12" style="fill:var(--m-ink-3)">#1043 · due Nov 3</text>
        <text x="236" y="43" font-size="15" font-weight="600" style="fill:var(--m-ink)">$2,400</text>
        <circle cx="352" cy="38" r="5" style="fill:var(--m-accent)"/><circle cx="368" cy="38" r="5" style="fill:var(--m-tint-3)"/><circle cx="384" cy="38" r="5" style="fill:var(--m-tint-3)"/><circle cx="400" cy="38" r="5" style="fill:var(--m-tint-3)"/>
        <text x="416" y="42.5" font-size="12" style="fill:var(--m-ink-2)">1 of 4</text>
        <rect x="498" y="24" width="112" height="28" rx="14" style="fill:var(--m-tint)"/>
        <text x="554" y="42.5" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--m-accent-text)">Due in 2 days</text>
      </g>
      <line x1="0" y1="200" x2="668" y2="200" style="stroke:var(--m-line)"/>
      <g transform="translate(0 200)">
        <circle cx="44" cy="38" r="16" style="fill:var(--m-tint-2)"/>
        <text x="44" y="42.5" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--m-accent-text)">SN</text>
        <text x="72" y="34" font-size="15" font-weight="600" style="fill:var(--m-ink)">Studio North</text>
        <text x="72" y="54" font-size="12" style="fill:var(--m-ink-3)">#1039 · due Oct 20</text>
        <text x="236" y="43" font-size="15" font-weight="600" style="fill:var(--m-ink)">$850</text>
        <circle cx="352" cy="38" r="5" style="fill:var(--m-accent)"/><circle cx="368" cy="38" r="5" style="fill:var(--m-accent)"/><circle cx="384" cy="38" r="5" style="fill:var(--m-accent)"/><circle cx="400" cy="38" r="4" fill="none" stroke-width="1.5" style="stroke:var(--m-tint-3)"/>
        <text x="416" y="42.5" font-size="12" style="fill:var(--m-ink-2)">stopped</text>
        <rect x="498" y="24" width="64" height="28" rx="14" fill="#3FB97A" fill-opacity="0.14"/>
        <text x="530" y="42.5" font-size="12" font-weight="600" fill="#23885A" text-anchor="middle">Paid</text>
      </g>
      <line x1="0" y1="276" x2="668" y2="276" style="stroke:var(--m-line)"/>
      <g transform="translate(0 276)">
        <circle cx="44" cy="38" r="16" style="fill:var(--m-tint-2)"/>
        <text x="44" y="42.5" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--m-accent-text)">FC</text>
        <text x="72" y="34" font-size="15" font-weight="600" style="fill:var(--m-ink)">Field &amp; Co</text>
        <text x="72" y="54" font-size="12" style="fill:var(--m-ink-3)">#1044 · due Nov 10</text>
        <text x="236" y="43" font-size="15" font-weight="600" style="fill:var(--m-ink)">$1,730</text>
        <circle cx="352" cy="38" r="5" style="fill:var(--m-tint-3)"/><circle cx="368" cy="38" r="5" style="fill:var(--m-tint-3)"/><circle cx="384" cy="38" r="5" style="fill:var(--m-tint-3)"/><circle cx="400" cy="38" r="5" style="fill:var(--m-tint-3)"/>
        <text x="416" y="42.5" font-size="12" style="fill:var(--m-ink-2)">0 of 4</text>
        <rect x="498" y="24" width="92" height="28" rx="14" style="fill:var(--m-surface-2);stroke:var(--m-line)"/>
        <text x="544" y="42.5" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--m-ink-2)">Scheduled</text>
      </g>
    </g>

    <!-- The next reminder, as the client will read it -->
    <g transform="translate(964 296)">
      <rect width="356" height="352" rx="16" style="fill:var(--m-surface);stroke:var(--m-line)"/>
      <text x="24" y="36" font-size="11" font-weight="600" letter-spacing="1.1" style="fill:var(--m-ink-3)">NEXT REMINDER</text>
      <rect x="226" y="18" width="106" height="26" rx="13" style="fill:var(--m-tint)"/>
      <text x="279" y="36" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--m-accent-text)">Nov 2, 9:00</text>
      <text x="24" y="70" font-size="15" font-weight="600" style="fill:var(--m-ink)">Maple Design · #1042</text>
      <line x1="24" y1="88" x2="332" y2="88" style="stroke:var(--m-line)"/>
      <text x="24" y="116" font-size="13" style="fill:var(--m-ink-3)">To <tspan style="fill:var(--m-ink)">sam@example.com</tspan></text>
      <text x="24" y="146" font-size="15" font-weight="600" style="fill:var(--m-ink)">Invoice #1042, a quick reminder</text>
      <g font-size="14" style="fill:var(--m-ink-2)">
        <text x="24" y="176">Hi Sam, invoice #1042 for $1,200 was</text>
        <text x="24" y="198">due on Oct 28. You can pay it with the</text>
        <text x="24" y="220">link below whenever it suits you.</text>
      </g>
      <rect x="24" y="240" width="124" height="36" rx="9" fill="url(#btn)"/>
      <text x="86" y="263" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Pay invoice</text>
      <line x1="24" y1="296" x2="332" y2="296" style="stroke:var(--m-line)"/>
      <text x="24" y="326" font-size="12" style="fill:var(--m-ink-3)">Tone</text>
      <g font-size="12" font-weight="600" text-anchor="middle">
        <rect x="64" y="308" width="76" height="28" rx="14" style="fill:var(--m-surface-2);stroke:var(--m-line)"/>
        <text x="102" y="326.5" style="fill:var(--m-ink-2)">Friendly</text>
        <rect x="148" y="308" width="76" height="28" rx="14" stroke-width="1.5" style="fill:var(--m-tint);stroke:var(--m-accent-text)"/>
        <text x="186" y="326.5" style="fill:var(--m-accent-text)">Neutral</text>
        <rect x="232" y="308" width="58" height="28" rx="14" style="fill:var(--m-surface-2);stroke:var(--m-line)"/>
        <text x="261" y="326.5" style="fill:var(--m-ink-2)">Firm</text>
      </g>
    </g>
  </g>

  <!-- A payment arrives: the reminders for that invoice stop -->
  <g transform="translate(64 752)" filter="url(#lift)">
    <rect width="420" height="62" rx="16" stroke="#FFFFFF" stroke-opacity="0.12" style="fill:var(--m-reverse)"/>
    <circle cx="32" cy="31" r="11" fill="#3FB97A"/>
    <path d="M26.5 31l3.5 3.5 6.5-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="37" font-size="15" font-weight="600" fill="#FFFFFF">Studio North paid $850</text>
    <text x="398" y="37" font-size="14" fill="#FFFFFF" fill-opacity="0.65" text-anchor="end">reminders stopped</text>
  </g>
</svg>
