<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif">
  <!--FONTS dm-400 dm-600 manrope-600 mono-400-->
  <!-- Colour roles, Forma light here; src/pages/images/[mockup].svg.ts swaps in the preset's values. -->
  <style id="palette">svg{--m-surface:#FFFFFF;--m-surface-2:#F9F7FC;--m-line:#ECE8F2;--m-ink:#1B1426;--m-ink-2:#687083;--m-ink-3:#9BA4B6;--m-tint:#EFEBFF;--m-tint-2:#E4DDFB;--m-tint-3:#D9CFFB;--m-accent:#5B3FE0;--m-accent-text:#5B3FE0;--m-accent-2:#8B5CF6;--m-accent-light:#7B5CF2;--m-highlight:#C084FC;--m-grad-start:#6246EA;--m-terminal-accent:#A78BFA;--m-btn-1:#6A4EEE;--m-btn-2:#5236D6;--m-frame-1:#35278A;--m-frame-2:#5139C9;--m-frame-3:#7658EC;--m-glow:#CDB4FF;--m-page-glow:#C9B6FF;--m-reverse:#1B1426;--m-shadow:#1B1426;--m-shadow-tint:#2A1D5C}</style>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--m-frame-1)"/>
      <stop offset="0.52" style="stop-color:var(--m-frame-2)"/>
      <stop offset="1" style="stop-color:var(--m-frame-3)"/>
    </linearGradient>
    <radialGradient id="glowTR" cx="1600" cy="0" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-opacity="0.6" style="stop-color:var(--m-glow)"/>
      <stop offset="1" stop-opacity="0" style="stop-color:var(--m-glow)"/>
    </radialGradient>
    <radialGradient id="glowBL" cx="0" cy="900" r="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-opacity="0.32" style="stop-color:var(--m-highlight)"/>
      <stop offset="1" stop-opacity="0" style="stop-color:var(--m-highlight)"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#FFFFFF" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--m-grad-start)"/>
      <stop offset="0.5" style="stop-color:var(--m-accent-2)"/>
      <stop offset="1" style="stop-color:var(--m-highlight)"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--m-btn-1)"/>
      <stop offset="1" style="stop-color:var(--m-btn-2)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-opacity="0.35" style="flood-color:var(--m-shadow)"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity="0.28" style="flood-color:var(--m-shadow)"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#frame)"/>
  <rect width="1600" height="900" fill="url(#glowTR)"/>
  <rect width="1600" height="900" fill="url(#glowBL)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- The app window: a founder's waitlist page and its report -->
  <g transform="translate(120 88)">
    <rect width="1360" height="860" rx="22" filter="url(#shadow)" style="fill:var(--m-surface)"/>
    <path d="M22 0h1316a22 22 0 0 1 22 22v30H0V22A22 22 0 0 1 22 0z" style="fill:var(--m-surface-2)"/>
    <line x1="0" y1="52" x2="1360" y2="52" style="stroke:var(--m-line)"/>
    <circle cx="28" cy="26" r="6" style="fill:var(--m-tint-2)"/>
    <circle cx="48" cy="26" r="6" style="fill:var(--m-tint-2)"/>
    <circle cx="68" cy="26" r="6" style="fill:var(--m-tint-2)"/>
    <rect x="560" y="14" width="240" height="25" rx="12.5" style="fill:var(--m-surface);stroke:var(--m-line)"/>
    <path d="M637 24.5v-2a3 3 0 0 1 6 0v2 M635.5 24.5h9v7h-9z" fill="none" stroke-width="1.4" stroke-linejoin="round" style="stroke:var(--m-ink-3)"/>
    <text x="652" y="31" font-size="13" style="fill:var(--m-ink-2)">invoicely.com</text>

    <!-- Founder's page -->
    <rect x="48" y="80" width="26" height="26" rx="8" fill="url(#btn)"/>
    <path d="M56 99l5-9 5 9" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="99" font-family="Manrope, sans-serif" font-size="17" font-weight="600" style="fill:var(--m-ink)">Invoicely</text>
    <rect x="476" y="89" width="40" height="7" rx="3.5" fill-opacity="0.1" style="fill:var(--m-ink)"/>
    <rect x="532" y="89" width="40" height="7" rx="3.5" fill-opacity="0.1" style="fill:var(--m-ink)"/>
    <rect x="588" y="89" width="40" height="7" rx="3.5" fill-opacity="0.1" style="fill:var(--m-ink)"/>
    <rect x="664" y="76" width="124" height="34" rx="9" style="fill:var(--m-ink)"/>
    <text x="726" y="98" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--m-surface)">Join waitlist</text>

    <rect x="48" y="146" width="152" height="30" rx="15" style="fill:var(--m-tint)"/>
    <circle cx="66" cy="161" r="4" style="fill:var(--m-accent)"/>
    <text x="78" y="166" font-size="13" font-weight="600" style="fill:var(--m-accent-text)">Early access</text>
    <text x="48" y="238" font-family="Manrope, sans-serif" font-size="50" font-weight="600" letter-spacing="-1.6" style="fill:var(--m-ink)">Invoices that chase</text>
    <text x="48" y="296" font-family="Manrope, sans-serif" font-size="50" font-weight="600" fill="url(#violet)" letter-spacing="-1.6">themselves.</text>
    <text x="48" y="340" font-size="18" style="fill:var(--m-ink-2)">Polite reminders, on schedule, until the client pays.</text>

    <rect x="48" y="368" width="384" height="56" rx="12" stroke-width="1.5" style="fill:var(--m-surface);stroke:var(--m-tint-2)"/>
    <text x="70" y="402" font-size="16" style="fill:var(--m-ink-3)">you@studio.com</text>
    <rect x="444" y="368" width="196" height="56" rx="12" fill="url(#btn)"/>
    <rect x="445" y="369" width="194" height="1.5" rx="0.75" fill="#FFFFFF" fill-opacity="0.35"/>
    <text x="542" y="402" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Join the waitlist</text>

    <circle cx="62" cy="458" r="12" stroke-width="2.5" style="fill:var(--m-highlight);stroke:var(--m-surface)"/>
    <circle cx="82" cy="458" r="12" stroke-width="2.5" style="fill:var(--m-accent-2);stroke:var(--m-surface)"/>
    <circle cx="102" cy="458" r="12" stroke-width="2.5" style="fill:var(--m-accent);stroke:var(--m-surface)"/>
    <text x="126" y="463" font-size="14" style="fill:var(--m-ink-2)">Your place in line moves up when friends join</text>

    <g transform="translate(48 512)">
      <rect width="236" height="180" rx="16" style="fill:var(--m-surface-2);stroke:var(--m-line)"/>
      <text x="22" y="38" font-size="15" font-weight="600" style="fill:var(--m-ink)">Solo</text>
      <text x="22" y="78" font-family="Manrope, sans-serif" font-size="30" font-weight="600" style="fill:var(--m-ink)">$5<tspan font-family="'DM Sans', sans-serif" font-size="14" font-weight="400" style="fill:var(--m-ink-2)">/mo</tspan></text>
      <rect x="22" y="96" width="150" height="7" rx="3.5" fill-opacity="0.08" style="fill:var(--m-ink)"/>
      <rect x="22" y="126" width="192" height="36" rx="10" style="fill:var(--m-surface);stroke:var(--m-tint-3)"/>
      <text x="118" y="149" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--m-accent-text)">Choose plan</text>
    </g>
    <g transform="translate(300 512)">
      <rect width="236" height="180" rx="16" stroke-width="1.5" style="fill:var(--m-surface);stroke:var(--m-accent-text)"/>
      <text x="22" y="38" font-size="15" font-weight="600" style="fill:var(--m-ink)">Studio</text>
      <text x="22" y="78" font-family="Manrope, sans-serif" font-size="30" font-weight="600" style="fill:var(--m-ink)">$12<tspan font-family="'DM Sans', sans-serif" font-size="14" font-weight="400" style="fill:var(--m-ink-2)">/mo</tspan></text>
      <rect x="22" y="96" width="170" height="7" rx="3.5" fill-opacity="0.08" style="fill:var(--m-ink)"/>
      <rect x="22" y="126" width="192" height="36" rx="10" fill="url(#btn)"/>
      <text x="118" y="149" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Choose plan</text>
    </g>
    <g transform="translate(552 512)">
      <rect width="236" height="180" rx="16" style="fill:var(--m-surface-2);stroke:var(--m-line)"/>
      <text x="22" y="38" font-size="15" font-weight="600" style="fill:var(--m-ink)">Agency</text>
      <text x="22" y="78" font-family="Manrope, sans-serif" font-size="30" font-weight="600" style="fill:var(--m-ink)">$29<tspan font-family="'DM Sans', sans-serif" font-size="14" font-weight="400" style="fill:var(--m-ink-2)">/mo</tspan></text>
      <rect x="22" y="96" width="140" height="7" rx="3.5" fill-opacity="0.08" style="fill:var(--m-ink)"/>
      <rect x="22" y="126" width="192" height="36" rx="10" style="fill:var(--m-surface);stroke:var(--m-tint-3)"/>
      <text x="118" y="149" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--m-accent-text)">Choose plan</text>
    </g>

    <!-- Report panel -->
    <rect x="836" y="52" width="524" height="808" style="fill:var(--m-surface-2)"/>
    <line x1="836" y1="52" x2="836" y2="860" style="stroke:var(--m-line)"/>
    <text x="864" y="98" font-family="'JetBrains Mono', monospace" font-size="15" style="fill:var(--m-ink)">npm run report</text>
    <rect x="1222" y="80" width="110" height="26" rx="13" style="fill:var(--m-surface);stroke:var(--m-line)"/>
    <circle cx="1238" cy="93" r="4" fill="#3FB97A"/>
    <text x="1250" y="98" font-size="12" style="fill:var(--m-ink-2)">last 14 days</text>

    <rect x="864" y="124" width="468" height="78" rx="14" style="fill:var(--m-surface);stroke:var(--m-line)"/>
    <text x="886" y="152" font-size="11" font-weight="600" letter-spacing="1.2" style="fill:var(--m-ink-3)">HYPOTHESIS</text>
    <text x="886" y="180" font-size="16" font-weight="600" style="fill:var(--m-ink)">10% of /pricing visitors pick a plan</text>

    <g transform="translate(864 218)">
      <rect width="226" height="132" rx="14" style="fill:var(--m-surface);stroke:var(--m-line)"/>
      <text x="18" y="30" font-size="13" style="fill:var(--m-ink-2)">Signups per day</text>
      <g transform="translate(18 116)">
        <rect x="0" y="-30" width="18" height="30" rx="4" style="fill:var(--m-accent)"/><rect x="0" y="-44" width="18" height="12" rx="4" style="fill:var(--m-tint-3)"/>
        <rect x="27" y="-40" width="18" height="40" rx="4" style="fill:var(--m-accent)"/><rect x="27" y="-54" width="18" height="12" rx="4" style="fill:var(--m-tint-3)"/>
        <rect x="54" y="-34" width="18" height="34" rx="4" style="fill:var(--m-accent)"/><rect x="54" y="-50" width="18" height="14" rx="4" style="fill:var(--m-tint-3)"/>
        <rect x="81" y="-52" width="18" height="52" rx="4" style="fill:var(--m-accent)"/><rect x="81" y="-64" width="18" height="10" rx="4" style="fill:var(--m-tint-3)"/>
        <rect x="108" y="-60" width="18" height="60" rx="4" style="fill:var(--m-accent)"/><rect x="108" y="-74" width="18" height="12" rx="4" style="fill:var(--m-tint-3)"/>
        <rect x="135" y="-48" width="18" height="48" rx="4" style="fill:var(--m-accent)"/><rect x="135" y="-62" width="18" height="12" rx="4" style="fill:var(--m-tint-3)"/>
        <rect x="162" y="-66" width="18" height="66" rx="4" style="fill:var(--m-accent)"/><rect x="162" y="-78" width="18" height="10" rx="4" style="fill:var(--m-tint-3)"/>
      </g>
    </g>
    <g transform="translate(1106 218)">
      <rect width="226" height="132" rx="14" style="fill:var(--m-surface);stroke:var(--m-line)"/>
      <text x="18" y="30" font-size="13" style="fill:var(--m-ink-2)">Referral joins</text>
      <path d="M18 106 C 48 100, 62 84, 88 88 S 128 64, 150 66 S 186 44, 208 38" fill="none" stroke-width="3" stroke-linecap="round" style="stroke:var(--m-accent-2)"/>
      <path d="M18 106 C 48 100, 62 84, 88 88 S 128 64, 150 66 S 186 44, 208 38 V 116 H 18 Z" fill-opacity="0.1" style="fill:var(--m-accent-2)"/>
      <circle cx="208" cy="38" r="5" stroke-width="2.5" style="fill:var(--m-surface);stroke:var(--m-accent-2)"/>
    </g>

    <g transform="translate(864 366)">
      <rect width="468" height="112" rx="14" style="fill:var(--m-surface);stroke:var(--m-line)"/>
      <text x="18" y="32" font-size="13" style="fill:var(--m-ink-2)">Plan intent rate</text>
      <rect x="18" y="58" width="432" height="12" rx="6" style="fill:var(--m-tint)"/>
      <rect x="18" y="58" width="252" height="12" rx="6" fill="url(#violet)"/>
      <line x1="234" y1="48" x2="234" y2="80" stroke-width="1.6" stroke-dasharray="3 3" style="stroke:var(--m-ink)"/>
      <text x="240" y="96" font-size="12" style="fill:var(--m-ink-2)">your target</text>
    </g>

    <g transform="translate(864 494)">
      <rect width="468" height="158" rx="14" style="fill:var(--m-surface);stroke:var(--m-line)"/>
      <text x="18" y="32" font-size="13" style="fill:var(--m-ink-2)">Top sources</text>
      <text x="18" y="66" font-family="'JetBrains Mono', monospace" font-size="12" style="fill:var(--m-ink)">newsletter</text>
      <rect x="128" y="56" width="300" height="12" rx="6" style="fill:var(--m-accent)"/>
      <text x="18" y="98" font-family="'JetBrains Mono', monospace" font-size="12" style="fill:var(--m-ink)">community</text>
      <rect x="128" y="88" width="196" height="12" rx="6" style="fill:var(--m-accent-2)"/>
      <text x="18" y="130" font-family="'JetBrains Mono', monospace" font-size="12" style="fill:var(--m-ink)">ads</text>
      <rect x="128" y="120" width="96" height="12" rx="6" style="fill:var(--m-highlight)"/>
    </g>

    <rect x="864" y="668" width="468" height="52" rx="14" style="fill:var(--m-tint)"/>
    <circle cx="890" cy="694" r="10" style="fill:var(--m-accent)"/>
    <path d="M885 694l3.5 3.5 6.5-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="910" y="699" font-size="14" font-weight="600" style="fill:var(--m-accent-text)">Disclosure shown on every plan click</text>
  </g>

  <!-- The check that runs before deploy -->
  <g transform="translate(64 752)" filter="url(#lift)">
    <rect width="336" height="62" rx="16" stroke="#FFFFFF" stroke-opacity="0.12" style="fill:var(--m-reverse)"/>
    <circle cx="32" cy="31" r="11" style="fill:var(--m-accent)"/>
    <path d="M26.5 31l3.5 3.5 6.5-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="37" font-family="'JetBrains Mono', monospace" font-size="15" fill="#FFFFFF">npm run validate</text>
    <text x="314" y="37" font-size="14" fill="#FFFFFF" fill-opacity="0.65" text-anchor="end">22/22 checks</text>
  </g>
</svg>
