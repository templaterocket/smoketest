<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1440" width="1200" height="1440" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif">
  <!--FONTS dm-400 dm-600 manrope-600 mono-400-->
  <!-- Colour roles, Forma light here; src/pages/images/[mockup].svg.ts swaps in the preset's values. -->
  <style id="palette">svg{--m-surface:#FFFFFF;--m-surface-2:#F9F7FC;--m-line:#ECE8F2;--m-ink:#1B1426;--m-ink-2:#687083;--m-ink-3:#9BA4B6;--m-tint:#EFEBFF;--m-tint-2:#E4DDFB;--m-tint-3:#D9CFFB;--m-accent:#5B3FE0;--m-accent-text:#5B3FE0;--m-accent-2:#8B5CF6;--m-accent-light:#7B5CF2;--m-highlight:#C084FC;--m-grad-start:#6246EA;--m-terminal-accent:#A78BFA;--m-btn-1:#6A4EEE;--m-btn-2:#5236D6;--m-frame-1:#35278A;--m-frame-2:#5139C9;--m-frame-3:#7658EC;--m-glow:#CDB4FF;--m-page-glow:#C9B6FF;--m-reverse:#1B1426;--m-shadow:#1B1426;--m-shadow-tint:#2A1D5C}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--m-surface-2)"/>
      <stop offset="1" style="stop-color:var(--m-tint)"/>
    </linearGradient>
    <radialGradient id="glow" cx="1200" cy="0" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-opacity="0.55" style="stop-color:var(--m-page-glow)"/>
      <stop offset="1" stop-opacity="0" style="stop-color:var(--m-page-glow)"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill-opacity="0.13" style="fill:var(--m-accent)"/>
    </pattern>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--m-accent)"/>
      <stop offset="1" style="stop-color:var(--m-accent-2)"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--m-btn-1)"/>
      <stop offset="1" style="stop-color:var(--m-btn-2)"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--m-accent-light)"/>
      <stop offset="1" style="stop-color:var(--m-accent)"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-opacity="0.18" style="flood-color:var(--m-shadow-tint)"/>
    </filter>
  </defs>
  <rect width="1200" height="1440" fill="url(#bg)"/>
  <rect width="1200" height="1440" fill="url(#glow)"/>
  <rect width="1200" height="1440" fill="url(#dots)"/>

  <!-- 1 · The interview -->
  <g transform="translate(100 120)" filter="url(#shadow)">
    <rect width="690" height="392" rx="22" style="fill:var(--m-reverse)"/>
    <circle cx="28" cy="26" r="6" fill="#FFFFFF" fill-opacity="0.16"/>
    <circle cx="48" cy="26" r="6" fill="#FFFFFF" fill-opacity="0.16"/>
    <circle cx="68" cy="26" r="6" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="345" y="31" font-family="'JetBrains Mono', monospace" font-size="13" fill="#FFFFFF" fill-opacity="0.4" text-anchor="middle">~/invoicely · coding agent</text>
    <line x1="0" y1="52" x2="690" y2="52" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g font-family="'JetBrains Mono', monospace" font-size="17">
      <text x="34" y="96" fill="#FFFFFF"><tspan fill-opacity="0.4">&gt;</tspan> <tspan style="fill:var(--m-terminal-accent)">/validate-setup</tspan></text>
      <text x="34" y="134" style="fill:var(--m-terminal-accent)">? What problem does the product solve?</text>
      <text x="34" y="162" fill="#FFFFFF">  Freelancers chase late invoices by hand</text>
      <text x="34" y="200" style="fill:var(--m-terminal-accent)">? Who feels it most?</text>
      <text x="34" y="228" fill="#FFFFFF">  Solo designers and developers</text>
      <text x="34" y="266" style="fill:var(--m-terminal-accent)">? What would you charge?</text>
      <text x="34" y="294" fill="#FFFFFF">  $12 a month</text>
      <text x="34" y="336" fill="#7EE2A8">✓ site.config.ts written</text>
      <text x="34" y="364" fill="#7EE2A8">✓ hero, pricing and FAQ filled</text>
    </g>
  </g>

  <!-- 2 · The live page -->
  <g transform="translate(396 488)" filter="url(#shadow)">
    <rect width="704" height="408" rx="22" style="fill:var(--m-surface)"/>
    <path d="M22 0h660a22 22 0 0 1 22 22v24H0V22A22 22 0 0 1 22 0z" style="fill:var(--m-surface-2)"/>
    <line x1="0" y1="46" x2="704" y2="46" style="stroke:var(--m-line)"/>
    <circle cx="26" cy="23" r="5.5" style="fill:var(--m-tint-2)"/>
    <circle cx="44" cy="23" r="5.5" style="fill:var(--m-tint-2)"/>
    <circle cx="62" cy="23" r="5.5" style="fill:var(--m-tint-2)"/>
    <rect x="252" y="11" width="200" height="24" rx="12" style="fill:var(--m-surface);stroke:var(--m-line)"/>
    <text x="352" y="28" font-size="12" text-anchor="middle" style="fill:var(--m-ink-2)">invoicely.pages.dev</text>
    <rect x="40" y="76" width="132" height="28" rx="14" style="fill:var(--m-tint)"/>
    <circle cx="57" cy="90" r="4" style="fill:var(--m-accent)"/>
    <text x="68" y="95" font-size="12.5" font-weight="600" style="fill:var(--m-accent-text)">Early access</text>
    <text x="40" y="154" font-family="Manrope, sans-serif" font-size="34" font-weight="600" letter-spacing="-0.9" style="fill:var(--m-ink)">Invoices that chase themselves.</text>
    <text x="40" y="188" font-size="15" style="fill:var(--m-ink-2)">Polite reminders, on schedule, until the client pays.</text>
    <rect x="40" y="214" width="320" height="50" rx="11" stroke-width="1.5" style="fill:var(--m-surface);stroke:var(--m-tint-2)"/>
    <text x="60" y="245" font-size="15" style="fill:var(--m-ink-3)">you@studio.com</text>
    <rect x="372" y="214" width="180" height="50" rx="11" fill="url(#btn)"/>
    <text x="462" y="245" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Join the waitlist</text>
    <g font-size="13" style="fill:var(--m-ink)">
      <rect x="40" y="296" width="132" height="32" rx="16" style="fill:var(--m-surface-2);stroke:var(--m-line)"/>
      <circle cx="58" cy="312" r="4" style="fill:var(--m-accent)"/><text x="70" y="317">Double opt-in</text>
      <rect x="182" y="296" width="108" height="32" rx="16" style="fill:var(--m-surface-2);stroke:var(--m-line)"/>
      <circle cx="200" cy="312" r="4" style="fill:var(--m-accent-2)"/><text x="212" y="317">Turnstile</text>
      <rect x="300" y="296" width="132" height="32" rx="16" style="fill:var(--m-surface-2);stroke:var(--m-line)"/>
      <circle cx="318" cy="312" r="4" style="fill:var(--m-highlight)"/><text x="330" y="317">UTM captured</text>
    </g>
  </g>
  <g transform="translate(790 838)" filter="url(#shadow)">
    <rect width="330" height="164" rx="18" style="fill:var(--m-surface);stroke:var(--m-line)"/>
    <rect x="22" y="22" width="44" height="44" rx="12" style="fill:var(--m-tint)"/>
    <path d="M33 36h22v16H33z M33 36l11 8 11-8" fill="none" stroke-width="2" stroke-linejoin="round" style="stroke:var(--m-accent-text)"/>
    <text x="80" y="40" font-size="16" font-weight="600" style="fill:var(--m-ink)">Confirm your email</text>
    <text x="80" y="61" font-size="13" style="fill:var(--m-ink-2)">One click and you’re on the list.</text>
    <rect x="22" y="94" width="286" height="44" rx="11" fill="url(#btn)"/>
    <text x="165" y="122" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Confirm</text>
  </g>

  <!-- 3 · The signal -->
  <g transform="translate(100 948)" filter="url(#shadow)">
    <rect width="690" height="372" rx="22" style="fill:var(--m-surface)"/>
    <text x="34" y="52" font-family="'JetBrains Mono', monospace" font-size="16" style="fill:var(--m-ink)">npm run report</text>
    <rect x="34" y="72" width="12" height="12" rx="3" style="fill:var(--m-accent)"/>
    <text x="54" y="83" font-size="13" style="fill:var(--m-ink-2)">confirmed</text>
    <rect x="132" y="72" width="12" height="12" rx="3" style="fill:var(--m-tint-3)"/>
    <text x="152" y="83" font-size="13" style="fill:var(--m-ink-2)">pending opt-in</text>
    <rect x="514" y="32" width="142" height="28" rx="14" style="fill:var(--m-tint)"/>
    <text x="585" y="51" font-size="12.5" font-weight="600" text-anchor="middle" style="fill:var(--m-accent-text)">Signups per day</text>
    <g transform="translate(0 318)">
      <line x1="34" y1="0" x2="656" y2="0" style="stroke:var(--m-line)"/>
      <rect x="62" y="-62" width="56" height="62" rx="9" fill="url(#bar)"/><rect x="62" y="-90" width="56" height="24" rx="9" style="fill:var(--m-tint-3)"/>
      <rect x="148" y="-86" width="56" height="86" rx="9" fill="url(#bar)"/><rect x="148" y="-114" width="56" height="24" rx="9" style="fill:var(--m-tint-3)"/>
      <rect x="234" y="-72" width="56" height="72" rx="9" fill="url(#bar)"/><rect x="234" y="-104" width="56" height="28" rx="9" style="fill:var(--m-tint-3)"/>
      <rect x="320" y="-118" width="56" height="118" rx="9" fill="url(#bar)"/><rect x="320" y="-142" width="56" height="20" rx="9" style="fill:var(--m-tint-3)"/>
      <rect x="406" y="-140" width="56" height="140" rx="9" fill="url(#bar)"/><rect x="406" y="-170" width="56" height="26" rx="9" style="fill:var(--m-tint-3)"/>
      <rect x="492" y="-112" width="56" height="112" rx="9" fill="url(#bar)"/><rect x="492" y="-138" width="56" height="22" rx="9" style="fill:var(--m-tint-3)"/>
      <rect x="578" y="-164" width="56" height="164" rx="9" fill="url(#bar)"/><rect x="578" y="-196" width="56" height="28" rx="9" style="fill:var(--m-tint-3)"/>
      <line x1="34" y1="-126" x2="656" y2="-126" stroke-width="1.5" stroke-dasharray="5 5" stroke-opacity="0.5" style="stroke:var(--m-ink)"/>
      <rect x="34" y="-150" width="88" height="20" rx="10" style="fill:var(--m-surface)"/>
      <text x="40" y="-136" font-size="12" style="fill:var(--m-ink-2)">goal you set</text>
      <g font-size="12" text-anchor="middle" style="fill:var(--m-ink-3)">
        <text x="90" y="24">Mon</text><text x="176" y="24">Tue</text><text x="262" y="24">Wed</text><text x="348" y="24">Thu</text><text x="434" y="24">Fri</text><text x="520" y="24">Sat</text><text x="606" y="24">Sun</text>
      </g>
    </g>
  </g>

  <!-- Step numbers -->
  <g font-family="Manrope, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    <circle cx="100" cy="120" r="30" fill="url(#badge)" stroke-width="5" style="stroke:var(--m-surface)"/><text x="100" y="129">1</text>
    <circle cx="396" cy="488" r="30" fill="url(#badge)" stroke-width="5" style="stroke:var(--m-surface)"/><text x="396" y="497">2</text>
    <circle cx="100" cy="948" r="30" fill="url(#badge)" stroke-width="5" style="stroke:var(--m-surface)"/><text x="100" y="957">3</text>
  </g>
</svg>
