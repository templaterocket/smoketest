<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1440" width="1200" height="1440" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif">
  <!--FONTS dm-400 dm-600 manrope-600 mono-400-->
  <!-- Colour roles, Forma light here; src/pages/images/[mockup].svg.ts swaps in the preset's values. -->
  <style id="palette">svg{--m-surface:#FFFFFF;--m-surface-2:#F9F7FC;--m-line:#ECE8F2;--m-ink:#1B1426;--m-ink-2:#687083;--m-ink-3:#9BA4B6;--m-tint:#EFEBFF;--m-tint-2:#E4DDFB;--m-tint-3:#D9CFFB;--m-accent:#5B3FE0;--m-accent-text:#5B3FE0;--m-accent-2:#8B5CF6;--m-accent-light:#7B5CF2;--m-highlight:#C084FC;--m-grad-start:#6246EA;--m-terminal-accent:#A78BFA;--m-btn-1:#6A4EEE;--m-btn-2:#5236D6;--m-frame-1:#35278A;--m-frame-2:#5139C9;--m-frame-3:#7658EC;--m-glow:#CDB4FF;--m-page-glow:#C9B6FF;--m-reverse:#1B1426;--m-shadow:#1B1426;--m-shadow-tint:#2A1D5C}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--m-surface-2)"/>
      <stop offset="1" style="stop-color:var(--m-tint)"/>
    </linearGradient>
    <radialGradient id="glow" cx="1200" cy="0" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-opacity="0.55" style="stop-color:var(--m-page-glow)"/>
      <stop offset="1" stop-opacity="0" style="stop-color:var(--m-page-glow)"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill-opacity="0.13" style="fill:var(--m-accent)"/>
    </pattern>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--m-accent)"/>
      <stop offset="1" style="stop-color:var(--m-accent-2)"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--m-btn-1)"/>
      <stop offset="1" style="stop-color:var(--m-btn-2)"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--m-accent-light)"/>
      <stop offset="1" style="stop-color:var(--m-accent)"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-opacity="0.18" style="flood-color:var(--m-shadow-tint)"/>
    </filter>
  </defs>
  <rect width="1200" height="1440" fill="url(#bg)"/>
  <rect width="1200" height="1440" fill="url(#glow)"/>
  <rect width="1200" height="1440" fill="url(#dots)"/>

  <!-- 1 · An invoice comes in (Paylark is a made-up product; addresses on example.com) -->
  <g transform="translate(100 120)" filter="url(#shadow)">
    <rect width="690" height="392" rx="22" style="fill:var(--m-reverse)"/>
    <circle cx="28" cy="26" r="6" fill="#FFFFFF" fill-opacity="0.16"/>
    <circle cx="48" cy="26" r="6" fill="#FFFFFF" fill-opacity="0.16"/>
    <circle cx="68" cy="26" r="6" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="345" y="31" font-size="13" fill="#FFFFFF" fill-opacity="0.4" text-anchor="middle">Paylark · Add invoice</text>
    <line x1="0" y1="52" x2="690" y2="52" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="34" y="76" width="622" height="76" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.18" stroke-dasharray="6 5"/>
    <path d="M58 92h18l8 8v28H58z M76 92v8h8" fill="none" stroke-width="2" stroke-linejoin="round" style="stroke:var(--m-terminal-accent)"/>
    <text x="100" y="110" font-size="17" font-weight="600" fill="#FFFFFF">invoice-1042.pdf</text>
    <text x="100" y="134" font-size="13" fill="#FFFFFF" fill-opacity="0.5">Forwarded to invoices@example.com</text>
    <rect x="556" y="100" width="76" height="28" rx="14" fill="#7EE2A8" fill-opacity="0.14"/>
    <text x="594" y="119" font-size="13" font-weight="600" fill="#7EE2A8" text-anchor="middle">✓ Read</text>
    <g font-size="13" style="fill:var(--m-terminal-accent)">
      <text x="34" y="196">Client</text><text x="350" y="196">Amount</text>
      <text x="34" y="268">Due date</text><text x="350" y="268">Remind</text>
    </g>
    <g font-size="19" fill="#FFFFFF">
      <text x="34" y="226">Maple Design</text><text x="350" y="226">$1,200.00</text>
      <text x="34" y="298">Oct 28, 2026</text><text x="350" y="298">sam@example.com</text>
    </g>
    <line x1="34" y1="324" x2="656" y2="324" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="34" y="362" font-size="16" fill="#7EE2A8">✓ 4 reminders scheduled</text>
  </g>

  <!-- 2 · The schedule and the tone -->
  <g transform="translate(396 488)" filter="url(#shadow)">
    <rect width="704" height="408" rx="22" style="fill:var(--m-surface)"/>
    <text x="40" y="70" font-family="Manrope, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.6" style="fill:var(--m-ink)">Reminder schedule</text>
    <text x="40" y="98" font-size="14" style="fill:var(--m-ink-2)">Maple Design · invoice #1042</text>
    <rect x="560" y="48" width="104" height="32" rx="10" style="fill:var(--m-surface);stroke:var(--m-line)"/>
    <text x="612" y="69" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--m-ink)">Edit steps</text>
    <line x1="60" y1="150" x2="60" y2="320" stroke-width="2" style="stroke:var(--m-tint-2)"/>
    <g font-size="15">
      <circle cx="60" cy="150" r="10" style="fill:var(--m-accent)"/>
      <path d="M55 150l3.5 3.5 6.5-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="88" y="155" font-weight="600" style="fill:var(--m-ink)">3 days before the due date</text>
      <circle cx="60" cy="205" r="10" style="fill:var(--m-accent)"/>
      <path d="M55 205l3.5 3.5 6.5-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="88" y="210" font-weight="600" style="fill:var(--m-ink)">On the due date</text>
      <rect x="76" y="234" width="604" height="56" rx="12" style="fill:var(--m-tint)"/>
      <circle cx="60" cy="262" r="10" stroke-width="2.5" style="fill:var(--m-surface);stroke:var(--m-accent)"/>
      <text x="88" y="267" font-weight="600" style="fill:var(--m-ink)">5 days late</text>
      <circle cx="60" cy="320" r="10" stroke-width="2" style="fill:var(--m-surface);stroke:var(--m-tint-3)"/>
      <text x="88" y="325" font-weight="600" style="fill:var(--m-ink)">10 days late</text>
    </g>
    <g font-size="12" font-weight="600" text-anchor="middle">
      <rect x="408" y="136" width="76" height="28" rx="14" style="fill:var(--m-surface-2);stroke:var(--m-line)"/><text x="446" y="154.5" style="fill:var(--m-ink-2)">Friendly</text>
      <rect x="408" y="191" width="76" height="28" rx="14" style="fill:var(--m-surface-2);stroke:var(--m-line)"/><text x="446" y="209.5" style="fill:var(--m-ink-2)">Friendly</text>
      <rect x="408" y="248" width="76" height="28" rx="14" style="fill:var(--m-surface);stroke:var(--m-accent-text)"/><text x="446" y="266.5" style="fill:var(--m-accent-text)">Neutral</text>
      <rect x="408" y="306" width="76" height="28" rx="14" style="fill:var(--m-surface-2);stroke:var(--m-line)"/><text x="446" y="324.5" style="fill:var(--m-ink-2)">Firm</text>
    </g>
    <g font-size="13" text-anchor="end">
      <text x="664" y="155" style="fill:var(--m-ink-3)">Sent Oct 25</text>
      <text x="664" y="210" style="fill:var(--m-ink-3)">Sent Oct 28</text>
      <text x="664" y="267" font-weight="600" style="fill:var(--m-accent-text)">Next · Nov 2, 9:00</text>
      <text x="664" y="325" style="fill:var(--m-ink-3)">Nov 7</text>
    </g>
  </g>
  <g transform="translate(790 838)" filter="url(#shadow)">
    <rect width="330" height="164" rx="18" style="fill:var(--m-surface);stroke:var(--m-line)"/>
    <rect x="22" y="22" width="44" height="44" rx="12" style="fill:var(--m-tint)"/>
    <path d="M33 36h22v16H33z M33 36l11 8 11-8" fill="none" stroke-width="2" stroke-linejoin="round" style="stroke:var(--m-accent-text)"/>
    <text x="80" y="40" font-size="16" font-weight="600" style="fill:var(--m-ink)">Read it before it goes</text>
    <text x="80" y="61" font-size="13" style="fill:var(--m-ink-2)">From your address, in your words.</text>
    <rect x="22" y="94" width="286" height="44" rx="11" fill="url(#btn)"/>
    <text x="165" y="122" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Preview reminder</text>
  </g>

  <!-- 3 · Paid: the reminders stop -->
  <g transform="translate(100 948)" filter="url(#shadow)">
    <rect width="690" height="372" rx="22" style="fill:var(--m-surface)"/>
    <text x="34" y="60" font-size="14" style="fill:var(--m-ink-2)">Studio North · invoice #1039</text>
    <text x="34" y="112" font-family="Manrope, sans-serif" font-size="40" font-weight="600" letter-spacing="-1" style="fill:var(--m-ink)">$850.00</text>
    <rect x="556" y="40" width="100" height="32" rx="16" fill="#3FB97A" fill-opacity="0.14"/>
    <circle cx="578" cy="56" r="8" fill="#3FB97A"/>
    <path d="M574 56l2.8 2.8 5-5.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="596" y="61" font-size="14" font-weight="600" fill="#23885A">Paid</text>
    <text x="34" y="142" font-size="14" style="fill:var(--m-ink-2)">Paid Oct 24 · the last reminder was cancelled</text>
    <line x1="34" y1="170" x2="656" y2="170" style="stroke:var(--m-line)"/>
    <g font-size="15">
      <circle cx="44" cy="203" r="5" style="fill:var(--m-accent)"/>
      <text x="64" y="208" font-family="'JetBrains Mono', monospace" font-size="13" style="fill:var(--m-ink-3)">Oct 17</text><text x="150" y="208" style="fill:var(--m-ink)">Reminder 1 sent · Friendly</text>
      <circle cx="44" cy="237" r="5" style="fill:var(--m-accent)"/>
      <text x="64" y="242" font-family="'JetBrains Mono', monospace" font-size="13" style="fill:var(--m-ink-3)">Oct 20</text><text x="150" y="242" style="fill:var(--m-ink)">Reminder 2 sent · Friendly</text>
      <circle cx="44" cy="271" r="5" style="fill:var(--m-accent)"/>
      <text x="64" y="276" font-family="'JetBrains Mono', monospace" font-size="13" style="fill:var(--m-ink-3)">Oct 23</text><text x="150" y="276" style="fill:var(--m-ink)">Reminder 3 sent · Neutral</text>
      <circle cx="44" cy="305" r="6" fill="#3FB97A"/>
      <text x="64" y="310" font-family="'JetBrains Mono', monospace" font-size="13" style="fill:var(--m-ink-3)">Oct 24</text><text x="150" y="310" font-weight="600" style="fill:var(--m-ink)">Payment received · $850.00</text>
      <circle cx="44" cy="339" r="5" fill="none" stroke-width="1.5" style="stroke:var(--m-tint-3)"/>
      <text x="64" y="344" font-family="'JetBrains Mono', monospace" font-size="13" style="fill:var(--m-ink-3)">Oct 28</text><text x="150" y="344" style="fill:var(--m-ink-3)">Reminder 4 cancelled</text>
    </g>
  </g>

  <!-- Step numbers -->
  <g font-family="Manrope, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    <circle cx="100" cy="120" r="30" fill="url(#badge)" stroke-width="5" style="stroke:var(--m-surface)"/><text x="100" y="129">1</text>
    <circle cx="396" cy="488" r="30" fill="url(#badge)" stroke-width="5" style="stroke:var(--m-surface)"/><text x="396" y="497">2</text>
    <circle cx="100" cy="948" r="30" fill="url(#badge)" stroke-width="5" style="stroke:var(--m-surface)"/><text x="100" y="957">3</text>
  </g>
</svg>
